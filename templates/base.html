{% load static %}
<html>
<head>
	<title> {% block title %} {% endblock %} </title> 
	<style type="text/css">
		*{ font-size:40px; font-family:Roboto;}
		.nav {background-color:DarkBlue;}
		.nav a { color:white; text-decoration:none; padding:30px;}
	</style>
</head>
<body style="background-color:lightyellow">
<center>
	<div class='nav'>
	{% if user.is_authenticated %}
		<a href="{% url 'ulogout' %}"> Logout </a>
		<a href="{% url 'ucreatetask' %}"> Create Task </a>
		<a href="{% url 'taskview' %}"> View Task </a>
		<a href="{% url 'contact' %}"> Feedback </a>
	{% else %}
		<a href="{% url 'usignup' %}"> Signup </a>
		<a href="{% url 'ulogin' %}"> Login </a>
                <a href="{% url 'uresetpass' %}"> Reset Password  </a>
	{% endif %}
	</div>
	
	{% block content %} {% endblock %}
</center>
</body>
</html>
