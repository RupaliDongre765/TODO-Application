{% extends 'base.html' %}
{% load static%}
{% block title %} Home Page {% endblock %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
{% block content %}
<body style="background-color:Azure">
<h1> Home Page </h1>
<h2> Welcome  {{ user.username }}</h2>
<form method="POST">
<br>
<class="section">
        <div class="container">
            <div class="columns">
                <div class="column is-offset-4 is-4">
                    <div class="box">
                        <article class="media">
                            <div class="media-left">
                                        <p>
                             <span class="title">City : {{ city_weather.city }} </span>
                                     <br>
                         <span class="subtitle">Temperature : {{ city_weather.temperature }}°C</span>
                                        <br>Weather description  : {{ city_weather.description }}
                                           
                                        <img src="http://openweathermap.org/img/w/{{ city_weather.icon }}.png" alt="Image">
                                    </p>
                            </div>
                                  <div class="media-content">
                                <div class="content">
                                    <figure class="image is-50x50">
                                   
                                    </figure>		 
                                </div>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
